<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Derya Sarikaya{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --ink: #0f0e0c;
            --paper: #f5f2ed;
            --accent: #c84b2f;
            --muted: #8a8279;
            --border: #ddd9d2;
            --serif: 'DM Serif Display', Georgia, serif;
            --mono: 'DM Mono', monospace;
            --sans: 'DM Sans', sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.6;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 4rem;
            border-bottom: 1px solid var(--border);
            background: var(--paper);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .nav-logo img { display: block; width: auto; height: 34px; }

        .nav-logo-text {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 0.04em;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .nav-links a:hover { color: var(--ink); }

        .lang-btn {
            flex-shrink: 0;
            border: none;
            background: var(--ink);
            color: var(--paper);
            padding: 0.35rem 0.8rem;
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .lang-btn:hover { background: var(--accent); }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 4rem;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 6rem;
            padding: 2rem 4rem;
            border-top: 1px solid var(--border);
        }

        footer p {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--muted);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .de { display: block; }
        .en { display: none; }
        .de-i { display: inline; }
        .en-i { display: none; }
        .lang-en .de { display: none; }
        .lang-en .en { display: block; }
        .lang-en .de-i { display: none; }
        .lang-en .en-i { display: inline; }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }

            .nav-right {
                gap: 1rem;
            }

            .nav-links {
                gap: 1rem;
            }

            .nav-links a {
                font-size: 0.65rem;
            }

            .nav-logo-text {
                display: none;
            }

            main {
                padding: 0 1.5rem;
            }

            footer {
                flex-direction: column;
                padding: 1.5rem;
                text-align: center;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/#hero" class="nav-logo">
            <img src="/static/logo-transparent.png" alt="DS Logo">
            <span class="nav-logo-text">derya@deryasarikaya.ai</span>
        </a>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="/#hero">Home</a></li>
                <li><a href="/#about"><span class="de-i">Über mich</span><span class="en-i">About</span></a></li>
                <li><a href="/#projekte"><span class="de-i">Projekte</span><span class="en-i">Projects</span></a></li>
                <li><a href="/#kontakt"><span class="de-i">Kontakt</span><span class="en-i">Contact</span></a></li>
            </ul>
            <button class="lang-btn" onclick="toggleLang()" id="lang-btn">EN</button>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2026 Derya Sarikaya - <a href="mailto:derya@deryasarikaya.ai">derya@deryasarikaya.ai</a></p>
        <p><a href="/#impressum">Impressum</a></p>
    </footer>

    <script>
        function toggleLang() {
            const isEn = document.body.classList.contains('lang-en');
            if (isEn) {
                document.body.classList.remove('lang-en');
                document.getElementById('lang-btn').textContent = 'EN';
                localStorage.setItem('lang', 'de');
            } else {
                document.body.classList.add('lang-en');
                document.getElementById('lang-btn').textContent = 'DE';
                localStorage.setItem('lang', 'en');
            }
        }

        (function() {
            const saved = localStorage.getItem('lang');
            if (saved === 'en') {
                document.body.classList.add('lang-en');
                const btn = document.getElementById('lang-btn');
                if (btn) btn.textContent = 'DE';
            }
        })();
    </script>
</body>
</html>
